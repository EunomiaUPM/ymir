[package]
name = "ymir-oauth"
version = "0.8.0"
edition = "2024"

[dependencies]
ymir = { path = "../ymir" }
events = { package = "ymir-events", path = "../ymir-events" }
serde = { version = "1.0.203", features = ["default", "derive"] }
serde_json = { version = "1.0.117", features = ["default"] }
tokio = { version = "1.35.0", features = ["full"] }
tracing = "0.1"
axum = { version = "0.8.8", features = ["ws"] }
thiserror = "2.0.12"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.8.0", features = ["serde", "default", "v4", "v5"] }
sea-orm = { version = "1.1.1", features = ["sqlx-postgres", "runtime-tokio", "macros", "with-json", "serde_json"] }
sea-orm-migration = { version = "1.1.1" }
async-trait = "0.1.89"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
argon2 = "0.5.3"
sha2 = "0.10.9"
rand = "0.10.0"
base64 = "0.22.1"
mockall = "0.14.0"
serde_urlencoded = "0.7.1"
tower = { version = "0.5" }
http-body-util = "0.1.2"