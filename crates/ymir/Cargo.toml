[package]
name = "ymir"
version = "0.8.0"
edition.workspace = true

[dependencies]
sea-orm = { workspace = true }
async-trait = { workspace = true }
vaultrs = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
urlencoding = { workspace = true }
sea-orm-migration = { workspace = true }
urn = { workspace = true }
serde_urlencoded = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
ed25519-dalek = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
pkcs8 = { workspace = true }
bs58 = { workspace = true }
base64 = { workspace = true }
json-canon = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
mockall = { workspace = true, optional = true }
url = { workspace = true }
json_to_table = { workspace = true }
serde_norway = { workspace = true }
arc-swap = { workspace = true }
jsonschema = { workspace = true }
opentelemetry-otlp = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry_sdk = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
tonic = { workspace = true, optional = true }
tonic-reflection = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[features]
# mockall doubles of the service and repository traits, for the tests of dependent crates.
mock = ["dep:mockall"]
# gRPC plane of the boot: tonic server, reflection and the gRPC adapter helpers.
grpc = ["dep:tonic", "dep:tonic-reflection", "dep:prost-types"]
# Redis-backed caches and the boot-time cache flush.
redis = ["dep:redis"]

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
