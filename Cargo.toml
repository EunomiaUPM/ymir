[workspace]
resolver = "3"
members = ["crates/ymir", "crates/ymir-events"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
sea-orm = { version = "1.1.1", features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio", "macros", "with-json"] }
async-trait = "0.1.89"
vaultrs = "0.7.4"
axum = "0.8.8"
tokio = { version = "1.35.0", features = ["full"] }
urlencoding = { version = "2.1.3" }
sea-orm-migration = { version = "1.1.1" }
urn = { version = "0.7.0", features = ["serde"] }
serde_urlencoded = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
opentelemetry = "0.33"
tracing-opentelemetry = "0.34"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rsa = "0.9.10"
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8.5"
pkcs8 = "0.11.0"
bs58 = "0.5"
base64 = { version = "0.22", features = ["alloc"] }
json-canon = "0.1.3"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "form", "rustls", "http2", "stream"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v5"] }
x509-parser = "0.18.1"
mockall = { version = "0.14.0" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry_sdk = "0.33"
url = { version = "2.5.4" }
json_to_table = "0.12.0"
serde_norway = "0.9.42"
arc-swap = "1.9"
jsonschema = { version = "0.58", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tower = "0.5"
tower-http = { version = "0.6.2", features = ["trace", "cors", "fs"] }
bytes = "1.10.1"
http = "1.3.1"
tokio-util = "0.7.17"
clap = { version = "4.4.9", features = ["env", "derive", "wrap_help", "unicode"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
tonic = "0.14.2"
tonic-reflection = "0.14.2"
prost-types = "0.14.1"
redis = { version = "1.0.2", features = ["default", "aio", "tokio-comp", "json"] }
thiserror = "2.0.12"
log = "0.4"
hmac = "0.12"
futures-util = "0.3"
regex = "1"
